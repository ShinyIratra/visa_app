<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:fragment="title">Scan des dossiers</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="document-card">
            <div class="doc-header">
                <h1 class="doc-title">Scan des dossiers</h1>
                <p class="doc-subtitle">Depot des pieces requises</p>
            </div>

            <p class="info-text">Demande ID: <strong th:text="${demandeId}"></strong></p>

            <div class="alert alert-info">
                Veuillez telecharger les fichiers correspondant a chaque dossier. Cliquez sur le bouton de chaque dossier pour selectionner un fichier.
            </div>

            <form id="scanForm" th:attr="data-demande-id=${demandeId}">
                <div class="section">
                    <h2 class="section-title">Dossiers a scanner</h2>
                    <div id="dossiersList">
                        <div th:each="dossier : ${dossiers}" class="dossier-item">
                            <div class="dossier-header">
                                <span class="dossier-label" th:text="${dossier.libelle}">Dossier</span>
                                <span class="badge obligatoire" th:if="${dossier.obligatoire}">Obligatoire</span>
                            </div>
                            <div class="file-input-wrapper">
                                <input type="file" th:id="'file_dossier_' + ${dossier.id}" th:name="'dossier_' + ${dossier.id}">
                                <label class="file-input-label" th:for="'file_dossier_' + ${dossier.id}">Choisir un fichier</label>
                                <span class="file-name">(Aucun fichier selectionne)</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="actions-bar">
                    <button type="button" class="btn btn-outline" onclick="window.location.href='/visa-requests'">Annuler</button>
                    <button type="submit" class="btn btn-primary">Terminer le scan</button>
                </div>
            </form>

            <script th:src="@{/js/scan.js}"></script>
        </div>
    </div>
</body>

</html>
