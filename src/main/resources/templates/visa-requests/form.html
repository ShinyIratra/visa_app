<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande de transformation de visa</title>
    <link id="global-css" rel="stylesheet" th:href="@{/css/global.css}">
    <link id="visa-css" rel="stylesheet" th:href="@{/css/visa-form.css}">
</head>

<body>
    <div class="visa-form-container">
        <div class="header-top">
            <h1>DEMANDE DE TRANSFORMATION DE VISA</h1>
        </div>

        <form id="demandeForm" method="post" action="/visa-requests">
            <section>
                <div class="grid-container">
                    <div class="grid-item col-12">
                        <label>VISA DEMANDE</label>
                        <select id="typesDemande" name="typeDemande.id" required>
                            <option value="">-- CHOISIR (TRAVAILLEUR / INVESTISSEUR) --</option>
                        </select>
                    </div>
                </div>
            </section>

            <section>
                <h2>1. ETAT CIVIL</h2>
                <div class="grid-container">
                    <div class="grid-item col-6">
                        <label>NOM</label>
                        <input type="text" name="passeport.demandeur.nom" id="demandeur_nom" required />
                    </div>
                    <div class="grid-item col-6">
                        <label>PRÉNOMS</label>
                        <input type="text" name="passeport.demandeur.prenom" id="demandeur_prenom" required />
                    </div>
                    <div class="grid-item col-6">
                        <label>NOM DE JEUNE FILLE</label>
                        <input type="text" name="passeport.demandeur.nomJeuneFille" id="demandeur_nomJeuneFille" />
                    </div>
                    <div class="grid-item col-6">
                        <label>SITUATION DE FAMILLE</label>
                        <select id="situationsFamiliales" name="passeport.demandeur.situationFamiliale.id" required>
                            <option value="">--</option>
                        </select>
                    </div>
                    <div class="grid-item col-6">
                        <label>NATIONALITÉ</label>
                        <select id="nationalites" name="passeport.demandeur.nationalite.id" required>
                            <option value="">--</option>
                        </select>
                    </div>
                    <div class="grid-item col-6">
                        <label>DATE DE NAISSANCE</label>
                        <input type="date" name="passeport.demandeur.dateNaissance" id="demandeur_dateNaissance" required />
                    </div>
                    <div class="grid-item col-12">
                        <label>ADRESSE À MADAGASCAR</label>
                        <input type="text" name="passeport.demandeur.adresse" id="demandeur_adresse" required />
                    </div>
                    <div class="grid-item col-6">
                        <label>EMAIL</label>
                        <input type="email" name="passeport.demandeur.email" id="demandeur_email" />
                    </div>
                    <div class="grid-item col-6">
                        <label>TÉLÉPHONE</label>
                        <input type="tel" name="passeport.demandeur.numTel" id="demandeur_numTel" required />
                    </div>
                </div>
            </section>

            <section>
                <h2>2. PASSEPORT</h2>
                <div class="grid-container">
                    <div class="grid-item col-4">
                        <label>NUMÉRO DU DOCUMENT</label>
                        <input type="text" name="passeport.numero" id="passeport_numero" required />
                    </div>
                    <div class="grid-item col-4">
                        <label>DATE DE DÉLIVRANCE</label>
                        <input type="datetime-local" name="passeport.dateDelivrance" id="passeport_dateDelivrance" required />
                    </div>
                    <div class="grid-item col-4">
                        <label>DATE D'EXPIRATION</label>
                        <input type="datetime-local" name="passeport.dateExpiration" id="passeport_dateExpiration" required />
                    </div>
                </div>
            </section>

            <section>
                <h2>3. VISA TRANSFORMABLE</h2>
                <div class="grid-container">
                    <div class="grid-item col-4">
                        <label>RÉFÉRENCE VISA</label>
                        <input type="text" name="visaTransformable.reference" id="visa_reference" required />
                    </div>
                    <div class="grid-item col-4">
                        <label>DATE D'ENTRÉE À MADA</label>
                        <input type="datetime-local" name="visaTransformable.dateEntree" id="visa_dateEntree" required />
                    </div>
                    <div class="grid-item col-4">
                        <label>LIEU D'ENTRÉE</label>
                        <input type="text" name="visaTransformable.lieuEntree" id="visa_lieuEntree" required />
                    </div>
                    <div class="grid-item col-12">
                        <label>DATE DE SORTIE (FIN DE VALIDITÉ)</label>
                        <input type="datetime-local" name="visaTransformable.dateExpiration" id="visa_dateExpiration" required />
                    </div>
                </div>
            </section>

            <section id="dossiersSection">
                <h2>4. DOSSIERS À FOURNIR</h2>
                <div class="grid-container">
                    <div class="grid-item col-12">
                        <div id="dossiersList" class="checkbox-list">
                            <!-- JS -->
                        </div>
                    </div>
                </div>
            </section>

            <div class="actions-bar">
                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a th:href="@{/visa-requests}" class="btn btn-outline">Annuler</a>
            </div>
        </form>
    </div>
    <script>
        let donneesStatiques = {}; // Instancie ao @ fonction loadDonneesStatiques
        let typeSelect;
        let dossierList;

        // Main
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        function init() {
            typeSelect = document.getElementById('typesDemande');
            dossierList = document.getElementById('dossiersList');

            loadDonneesStatiques();
            typeSelect.addEventListener('change', updateDossiersAFournir);
        }

        function loadDonneesStatiques() {
            fetch('/api/static/all')
                .then(r => r.json())
                .then(resp => {
                    // Noproposen copilot zah hoe aleo console.error sy return maina be eto fa tsy mithrow new error
                    // fa tsy mahatoky anazy a dia avelako amin'io aloha  
                    if (!resp || !resp.success) {
                        throw new Error(`${resp?.error || 'Erreur inconnue'}`);
                    }

                    donneesStatiques = resp.data || {};
                    populateAllSelects(donneesStatiques);
                    updateDossiersAFournir();
                })
                .catch(e => console.error('Error loading static data', e));
        }

        function populateAllSelects(data) {
            fillSelect('typesDemande', data.typesDemande, i => i.libelle);
            fillSelect('situationsFamiliales', data.situationsFamiliales, i => i.libelle);
            fillSelect('nationalites', data.nationalites, i => i.libelle);
        }

        function fillSelect(id, arr, texte) {
            const s = document.getElementById(id);
            if (!s || !Array.isArray(arr)) return;

            s.innerHTML = '<option value="">--</option>';
            arr.forEach(it => {
                const opt = document.createElement('option');
                opt.value = it.id;
                opt.text = texte ? texte(it) : (it.libelle || it.numero || it.reference || it.id); // Proposition copilot
                s.appendChild(opt);
            });
        }

        /**
         * Fonction appelee 
         * - apres avoir load les donnees statiques
         * - apres avoir change le select: VISA demande
         */
        function updateDossiersAFournir() {
            const selectedId = typeSelect.value;
            const selectedType = donneesStatiques.typesDemande ? donneesStatiques.typesDemande.find(t => t.id == selectedId) : null;
            const libelle = selectedType ? selectedType.libelle.toLowerCase() : "";

            dossierList.innerHTML = "";

            // Selon la valeur du select choisi, On ajoute dans cette liste la liste des dossiers a afficher
            const sections = [
                { label: "DOSSIERS COMMUNES", items: donneesStatiques.dossiersCommuns || [] }
            ];

            // Tsy generalise fa alefako amin'io aloha amin'izay mazava ilay code
            if (libelle.includes("travailleur")) {
                sections.push({ label: "DOSSIERS TRAVAILLEUR", items: donneesStatiques.dossiersTravailleur || [] });
            } else if (libelle.includes("investisseur")) {
                sections.push({ label: "DOSSIERS INVESTISSEUR", items: donneesStatiques.dossiersInvestisseur || [] });
            }

            sections.forEach(renderDossierSection);
        }

        function renderDossierSection(sec) {
            if (sec.items.length > 0) {
                const group = document.createElement('div');
                group.className = "checkbox-item group-label";
                group.innerText = sec.label;
                dossierList.appendChild(group);

                sec.items.forEach(item => {
                    const div = document.createElement('label');
                    div.className = "checkbox-item";
                    const labelText = (item.libelle || item.nom || "Dossier sans label");
                    div.innerHTML = `<input type="checkbox" name="dossierIds" value="${item.id}"> ${labelText}`;
                    dossierList.appendChild(div);
                });
            }
        }
    </script>
</body>

</html>
