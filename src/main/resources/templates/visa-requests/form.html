<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire demande visa</title>
    <!-- CSS removed per request -->
</head>
<body>
<div>
    <h1 th:text="${demande.id == null} ? 'Nouvelle demande' : 'Modifier la demande'"></h1>

    <form th:object="${demande}"
          th:action="${demande.id == null} ? @{/visa-requests} : @{/visa-requests/{id}(id=${demande.id})}"
          method="post">

        <!-- Etat civil -->
        <section>
            <h2>Etat civil</h2>
            <div>
                <label>Nom</label>
                <input type="text" th:field="*{passeport.demandeur.nom}" />
            </div>
            <div>
                <label>Prénoms</label>
                <input type="text" th:field="*{passeport.demandeur.prenom}" />
            </div>
            <div>
                <label>Nom de jeune fille</label>
                <input type="text" th:field="*{passeport.demandeur.nomJeuneFille}" />
            </div>
            <div>
                <label>Situation de famille</label>
                <select th:field="*{passeport.demandeur.situationFamiliale.id}">
                    <option value="">--</option>
                </select>
            </div>
            <div>
                <label>Nationalité</label>
                <select th:field="*{passeport.demandeur.nationalite.id}">
                    <option value="">--</option>
                </select>
            </div>
            <div>
                <label>Date de naissance</label>
                <input type="date" th:field="*{passeport.demandeur.dateNaissance}" />
            </div>
            <div>
                <label>Profession</label>
                <input type="text" name="profession" />
            </div>
            <div>
                <label>Adresse</label>
                <input type="text" th:field="*{passeport.demandeur.adresse}" />
            </div>
            <div>
                <label>Email</label>
                <input type="email" th:field="*{passeport.demandeur.email}" />
            </div>
            <div>
                <label>Téléphone</label>
                <input type="tel" th:field="*{passeport.demandeur.numTel}" />
            </div>
        </section>

        <!-- Passeport -->
        <section>
            <h2>Passeport</h2>
            <div>
                <label>Numéro</label>
                <input type="text" th:field="*{passeport.numero}" />
            </div>
            <div>
                <label>Date délivrance</label>
                <input type="datetime-local" th:field="*{passeport.dateDelivrance}" />
            </div>
            <div>
                <label>Date d'expiration</label>
                <input type="datetime-local" th:field="*{passeport.dateExpiration}" />
            </div>
        </section>

        <!-- Visa transformable -->
        <section>
            <h2>Visa transformable</h2>
            <div>
                <label>Réf visa</label>
                <input type="text" th:field="*{visaTransformable.reference}" />
            </div>
            <div>
                <label>Date entrée à Mada</label>
                <input type="datetime-local" th:field="*{visaTransformable.dateEntree}" />
            </div>
            <div>
                <label>Lieu entrée</label>
                <input type="text" th:field="*{visaTransformable.lieuEntree}" />
            </div>
            <div>
                <label>Date de sortie</label>
                <input type="datetime-local" th:field="*{visaTransformable.dateExpiration}" />
            </div>
        </section>

        <div>
            <button type="submit">Enregistrer</button>
            <a th:href="@{/visa-requests}">Annuler</a>
        </div>

    </form>
</div>
</body>
</html>
