<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:fragment="title">Erreur accès scan</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="document-card narrow-card">
            <div class="doc-header">
                <h1 class="doc-title">Acces au scan refuse</h1>
                <p class="doc-subtitle">Verification obligatoire</p>
            </div>

            <div class="seal-icon">!</div>

            <div class="alert alert-error" th:text="${error}">
                Erreur
            </div>

            <p class="info-text">
                Veuillez corriger tous les elements requis avant de pouvoir acceder au scan des dossiers.
            </p>

            <div class="actions actions-center">
                <a th:href="@{/visa-requests/{id}/edit(id=${demandeId})}" class="btn btn-primary">
                    Mettre a jour la demande
                </a>
                <a th:href="@{/visa-requests}" class="btn btn-outline">
                    Retour a la liste
                </a>
            </div>
        </div>
    </div>
</body>

</html>
