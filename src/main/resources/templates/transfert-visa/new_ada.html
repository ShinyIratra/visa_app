<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:fragment="title">Demande de transfert de visa (Avec donnée Antérieur)</title>
    <link id="global-css" rel="stylesheet" th:href="@{/css/global.css}">
    <link id="visa-css" rel="stylesheet" th:href="@{/css/visa-form.css}">
</head>

<body>
    <div layout:fragment="content">
        <div class="visa-form-container">
            <div class="header-top">
                <h1>DEMANDE DE TRANSFERT DE VISA (Avec données Antérieurs)</h1>
            </div>

            <form id="demandeForm">
                <section>
                    <h2>1. RECHERCHE DE LA DEMANDE ORIGINALE</h2>
                    <div class="grid-container">
                        <div class="grid-item col-6">
                            <label>RECHERCHER PAR</label>
                            <select id="type_recherche" name="type_recherche" required>
                                <option value="id_demande">ID de la demande</option>
                                <option value="id_visa">ID du visa</option>
                                <option value="passeport_original">N° Passeport de la demande originale</option>
                                <option value="carte_resident_passeport">Carte résident liée au passeport</option>
                                <option value="passeport_actuel">N° Passeport de la demande  (Derniere demande liee au passeport)</option>
                            </select>
                        </div>
                        <div class="grid-item col-6">
                            <label id="label_valeur">VALEUR</label>
                            <input type="text" name="valeur" id="valeur_recherche" placeholder="Entrez la valeur..." required />
                        </div>
                    </div>
                </section>

                <section>
                    <h2>2. NOUVEAU PASSEPORT</h2>
                    <div class="grid-container">
                        <div class="grid-item col-4">
                            <label>NUMÉRO DU DOCUMENT</label>
                            <input type="text" name="nouveauPasseport.numero" id="passeport_numero" value="NEW123456"
                                required />
                        </div>
                        <div class="grid-item col-4">
                            <label>DATE DE DÉLIVRANCE</label>
                            <input type="datetime-local" name="nouveauPasseport.dateDelivrance"
                                id="passeport_dateDelivrance" value="2024-01-01T08:00" required />
                        </div>
                        <div class="grid-item col-4">
                            <label>DATE D'EXPIRATION</label>
                            <input type="datetime-local" name="nouveauPasseport.dateExpiration"
                                id="passeport_dateExpiration" value="2034-01-01T08:00" required />
                        </div>
                    </div>
                </section>

                <div class="actions-bar">
                    <button type="submit" class="btn btn-primary">Demander le transfert</button>
                    <a th:href="@{/transfert-visa}" class="btn btn-outline">Annuler</a>
                </div>
            </form>
        </div>

        <script>
            function init() {
                const demandeForm = document.getElementById('demandeForm');
                const typeRechercheSelect = document.getElementById('type_recherche');
                const labelValeur = document.getElementById('label_valeur');
                const valeurInput = document.getElementById('valeur_recherche');

                typeRechercheSelect.addEventListener('change', function() {
                    const labels = {
                        'id_demande': 'ID DE LA DEMANDE',
                        'id_visa': 'ID DU VISA',
                        'passeport_original': 'NUMÉRO DU PASSEPORT ORIGINAL',
                        'carte_resident_passeport': 'N° PASSEPORT DE LA CARTE RÉSIDENT',
                        'passeport_actuel': 'NUMÉRO DU PASSEPORT ACTUEL (DERNIERE DEMANDE LIEE AU PASSEPORT)'
                    };
                    labelValeur.innerText = labels[this.value];
                    valeurInput.placeholder = "Entrez " + labels[this.value].toLowerCase() + "...";
                });

                demandeForm.addEventListener('submit', function (event) {
                    event.preventDefault();

                    const formData = new FormData(demandeForm);
                    const data = {
                        type_recherche: formData.get('type_recherche'),
                        valeur: formData.get('valeur'),
                        "nouveau passeport": {
                            numero: formData.get('nouveauPasseport.numero'),
                            dateDelivrance: formData.get('nouveauPasseport.dateDelivrance'),
                            dateExpiration: formData.get('nouveauPasseport.dateExpiration')
                        }
                    };

                    fetch('/transfert-visa/ada', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    })
                        .then(response => response.json())
                        .then(apiResponse => {
                            console.log(apiResponse);

                            if (apiResponse.success) {
                                window.location.href = '/transfert-visa';
                            } else {
                                throw new Error(apiResponse.error)
                            }
                        })
                        .catch(error => {
                            alert(error);
                        });
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        </script>
    </div>
</body>

</html>
