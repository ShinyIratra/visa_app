<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:fragment="title">Liste Transfert de Visa</title>
</head>
<body>
    <div layout:fragment="content">
        <h1>Liste Transfert de Visa</h1>

        <div class="filters" style="margin-bottom: 20px; padding: 15px; background: #f4f4f4; border-radius: 5px;">
            <label>Du: <input type="datetime-local" id="dateStart"></label>
            <label>Au: <input type="datetime-local" id="dateEnd"></label>
            <button onclick="filterByDate()">Filtrer</button>
            <button onclick="resetFilter()">Réinitialiser</button>
        </div>

        <table border=1>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Demandeur</th>
                    <th>Passeport original</th>
                    <th>Nouveau passeport</th>
                    <th>Nationalité</th>
                    <th>Statut</th>
                    <th>Date Création</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- transferts.js -->
            </tbody>
        </table>
        <script th:src="@{/js/transferts.js}"></script>
    </div>
</body>
</html>
