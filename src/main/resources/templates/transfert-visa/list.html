<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:fragment="title">Liste Transfert de Visa</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="document-card">
            <div class="doc-header">
                <h1 class="doc-title">Transferts de visa</h1>
                <p class="doc-subtitle">Registre des dossiers transferes</p>
            </div>

            <div class="page-header">
                <p class="lead-text">Consultez les anciens et nouveaux passeports lies a chaque demande.</p>
                <div class="page-actions">
                    <a class="btn btn-primary" th:href="@{/transfert-visa/new/sda}">Nouvelle demande</a>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Demandeur</th>
                            <th>Ancien passeport</th>
                            <th>Nouveau passeport</th>
                            <th>Nationalite</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- transferts.js -->
                        <tr>
                            <td colspan="7" class="empty">Aucune demande enregistree.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <script th:src="@{/js/transferts.js}"></script>
        </div>
    </div>
</body>
</html>
