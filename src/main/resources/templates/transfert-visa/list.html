<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:fragment="title">Liste Transfert de Visa</title>
</head>
<body>
    <div layout:fragment="content">
        <h1>Liste Transfert de Visa</h1>
        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Nom du demandeur</th>
                    <th>Prénom du demandeur</th>
                    <th>Numéro de passeport</th>
                    <th>Nationalité</th>
                    <th>Date de naissance</th>
                    <th>Motif du transfert</th>
                    <th>Statut</th>
                </tr>
            </thead>
            <tbody>
                <!-- Les données des demandes de transfert de visa seront affichées ici -->
            </tbody>
        </table>
    </div>
</body>
</html>
