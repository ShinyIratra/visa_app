<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:fragment="title">Demande de duplicata (Avec donnée antérieure)</title>
    <link id="visa-css" rel="stylesheet" th:href="@{/css/visa-form.css}">
</head>
<body>
    <div layout:fragment="content">
        <div class="visa-form-container">
            <div class="header-top">
                <h1>Demande de duplicata</h1>
                <p class="header-subtitle">Avec donnees anterieures</p>
            </div>
            <form id="demandeForm">
                <section>
                    <div class="grid-container">
                        <div class="grid-item col-12">
                            <label>DATE DE CRÉATION</label>
                            <input type="datetime-local" id="dateCreation" name="dateCreation" required />
                        </div>
                    </div>
                </section>
                <section>
                    <h2>1. RECHERCHE DE LA DEMANDE ORIGINALE</h2>
                    <div class="grid-container">
                        <div class="grid-item col-6">
                            <label>RECHERCHER PAR</label>
                            <select id="type_recherche" name="type_recherche" required>
                                <option value="id_demande">ID de la demande</option>
                                <option value="id_visa">ID du visa</option>
                                <option value="passeport_original">N° Passeport de la demande originale</option>
                                <option value="carte_resident_passeport">N° Passeport liee a une carte résident</option>
                                <option value="passeport_actuel">N° Passeport de la demande (Derniere demande liee au passeport)</option>
                            </select>
                        </div>
                        <div class="grid-item col-6">
                            <label id="label_valeur">VALEUR</label>
                            <input type="text" name="valeur" id="valeur_recherche" placeholder="Entrez la valeur..." required />
                        </div>
                    </div>
                </section>

                <div class="actions-bar">
                    <button type="submit" class="btn btn-primary">Demander le duplicata</button>
                    <a th:href="@{/duplicata}" class="btn btn-outline">Annuler</a>
                </div>
            </form>
        </div>
        <script>
            function init() {
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('dateCreation').value = now.toISOString().slice(0, 16);

                const demandeForm = document.getElementById('demandeForm');
                const typeRechercheSelect = document.getElementById('type_recherche');
                const labelValeur = document.getElementById('label_valeur');
                const valeurInput = document.getElementById('valeur_recherche');

                typeRechercheSelect.addEventListener('change', function() {
                    const labels = {
                        'id_demande': 'ID DE LA DEMANDE',
                        'id_visa': 'ID DU VISA',
                        'passeport_original': 'NUMÉRO DU PASSEPORT ORIGINAL',
                        'carte_resident_passeport': 'N° DU PASSEPORT LIEE A UNE CARTE RESIDENT',
                        'passeport_actuel': 'NUMÉRO DU PASSEPORT DE LA DEMANDE (DERNIERE DEMANDE LIEE AU PASSEPORT)'
                    };
                    labelValeur.innerText = labels[this.value];
                    valeurInput.placeholder = "Entrez " + labels[this.value].toLowerCase() + "...";
                });

                demandeForm.addEventListener('submit', function (event) {
                    event.preventDefault();

                    const formData = new FormData(demandeForm);
                    const data = {
                        "type_recherche": formData.get('type_recherche'),
                        "valeur": formData.get('valeur'),
                        "dateCreation": formData.get('dateCreation')
                    };

                    fetch('/duplicata/new/ada', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    })
                        .then(response => response.json())
                        .then(apiResponse => {
                            console.log(apiResponse);

                            if (apiResponse.success) {
                                // alert("Duplicata demandé avec succès");
                                window.location.href = '/duplicata';
                            } else {
                                throw new Error(apiResponse.error)
                            }
                        })
                        .catch(error => {
                            alert(error);
                        });
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        </script>
    </div>
</body>
</html>
