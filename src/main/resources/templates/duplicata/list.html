<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:fragment="title">Liste des demandes de duplicata</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="document-card">
            <div class="doc-header">
                <h1 class="doc-title">Demandes de duplicata</h1>
                <p class="doc-subtitle">Registre des reemissions</p>
            </div>

            <div class="page-header">
                <p class="lead-text">Consultez les demandes de duplicata et leurs statuts.</p>
                <div class="page-actions">
                    <a class="btn btn-primary" href="/sans-donne-anterieur/duplicata">Nouvelle demande</a>
                </div>
            </div>
            <div class="filters" style="margin-bottom: 20px; padding: 15px; background: #f4f4f4; border-radius: 5px;">
                <label>Du: <input type="datetime-local" id="dateStart"></label>
                <label>Au: <input type="datetime-local" id="dateEnd"></label>
                <button onclick="filterByDate()">Filtrer</button>
                <button onclick="resetFilter()">Réinitialiser</button>
            </div>

            <table border="1">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Demandeur</th>
                        <th>Passeport</th>
                        <th>Nationalité</th>
                        <th>Statut</th>
                        <th>Date Création</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!--  duplicatas.js -->
                </tbody>
            </table>
        </div>
        <script th:src="@{/js/duplicatas.js}"></script>
    </div>
</body>
</html>
