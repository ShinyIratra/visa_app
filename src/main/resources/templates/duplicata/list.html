<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:fragment="title">Liste des demandes de duplicata</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="document-card">
            <div class="doc-header">
                <h1 class="doc-title">Demandes de duplicata</h1>
                <p class="doc-subtitle">Registre des reemissions</p>
            </div>

            <div class="page-header">
                <p class="lead-text">Consultez les demandes de duplicata et leurs statuts.</p>
                <div class="page-actions">
                    <a class="btn btn-primary" href="/sans-donne-anterieur/duplicata">Nouvelle demande</a>
                </div>
            </div>
            <div class="filters">
                <div class="filters-row">
                    <label>Du
                        <input type="datetime-local" id="dateStart">
                    </label>
                    <label>Au
                        <input type="datetime-local" id="dateEnd">
                    </label>
                    <div class="filters-actions">
                        <button type="button" class="btn btn-primary" onclick="filterByDate()">Filtrer</button>
                        <button type="button" class="btn btn-outline" onclick="resetFilter()">Reinitialiser</button>
                    </div>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Demandeur</th>
                            <th>Passeport</th>
                            <th>Nationalite</th>
                            <th>Statut</th>
                            <th>Date creation</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- duplicatas.js -->
                        <tr>
                            <td colspan="7" class="empty">Aucune demande enregistree.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <script th:src="@{/js/duplicatas.js}"></script>
    </div>
</body>
</html>
