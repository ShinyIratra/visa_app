<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:fragment="title">Liste des visas</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="document-card">
            <div class="doc-header">
                <h1 class="doc-title">Visas delivres</h1>
                <p class="doc-subtitle">Registre des visas</p>
            </div>

            <p class="lead-text">Consultez les visas delivres et accedez aux demandes associees.</p>

            <div class="filters">
                <div class="filters-row">
                    <label for="startDate">Du
                        <input type="datetime-local" id="startDate">
                    </label>
                    <label for="endDate">Au
                        <input type="datetime-local" id="endDate">
                    </label>
                    <div class="filters-actions">
                        <button id="btnFilter" type="button" class="btn btn-primary">Filtrer</button>
                    </div>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="data-table" style="min-width: 1000px;">
                    <thead>
                        <tr>
                            <th>ID visa</th>
                            <th>Date creation</th>
                            <th>Date de validite</th>
                            <th>Demandeur</th>
                            <th>Ancien passeport</th>
                            <th>Nouveau passeport</th>
                            <th>ID demande</th>
                        </tr>
                    </thead>
                    <tbody id="visaTableBody">
                        <tr>
                            <td colspan="6" class="empty">Aucun visa trouve.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <script th:src="@{/js/visas.js}"></script>
        </div>
    </div>
</body>
</html>
